<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Inkwell Blog</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,600;8..60,700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <header class="nav">
    <div class="container nav-inner">
      <a class="brand" href="#/">Inkwell<span>.</span></a>
      <nav>
        <a href="#/">Home</a>
        <a href="#/mine" class="auth-only" hidden>My Posts</a>
        <a href="#/new" class="btn btn-primary auth-only" hidden>Write</a>
        <span class="auth-only user-chip" hidden>@<span id="userName"></span> <button class="link" id="logoutBtn">Logout</button></span>
        <button class="btn guest-only" id="loginBtn">Login</button>
        <button class="btn btn-primary guest-only" id="signupBtn">Sign up</button>
      </nav>
    </div>
  </header>

  <main class="container" id="app"></main>

  <footer class="footer"><div class="container">© <span id="year"></span> Inkwell · Flask REST API + SQL database</div></footer>

  <dialog id="authDialog">
    <form id="authForm">
      <h2 id="authTitle">Login</h2>
      <label class="register-only">Username<input name="username" autocomplete="username" /></label>
      <label><span id="loginLabel">Username or email</span><input name="login" required /></label>
      <label>Password<input name="password" type="password" required minlength="6" /></label>
      <p class="error" id="authError"></p>
      <button class="btn btn-primary full" type="submit" id="authSubmit">Login</button>
      <p class="muted center"><span id="authSwitchText">New here?</span> <button type="button" class="link" id="authSwitch">Create an account</button></p>
      <button type="button" class="link close-x" data-close>✕</button>
    </form>
  </dialog>

  <div class="toast" id="toast" hidden></div>
  <script src="/static/script.js"></script>
</body>
</html>
